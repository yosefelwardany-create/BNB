[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/habitat-worker.pid

[program:queue]
directory=/app
command=php artisan queue:work redis --queue=messaging,default,automation,webhooks,channels,ai,reports,imports --tries=3 --backoff=10,30,120 --max-jobs=1000 --max-time=3600 --timeout=300 --sleep=1 --rest=0.2
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=300
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:hostex-import]
directory=/app
command=php artisan channels:watch --no-interaction
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=300
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
