; Production PHP settings.

; Uploads: property photography and imported spreadsheets. Generous enough for
; a batch of phone photos, bounded so a single request cannot exhaust memory.
upload_max_filesize = 20M
post_max_size = 64M
max_file_uploads = 40

memory_limit = 512M
max_execution_time = 120

; Errors go to the log, never to the response: a stack trace in an API
; response leaks file paths and query structure.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED

expose_php = Off

; Sessions are stored in Redis, but these harden the cookie regardless.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; OPcache. Timestamp validation is off because the filesystem is immutable in
; a container — a new deploy is a new container.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.enable_file_override = 1

; Dates default to UTC; every property carries its own timezone and the
; application converts explicitly.
date.timezone = UTC
