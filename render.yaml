# Render Blueprint for the managed-service TEST environment.
#
# This is the isolated test deployment of the restructured platform. It is not
# the production blueprint: service names carry a `-test` suffix so they can
# live in the same Render account as production without touching it, the
# database is a Render PostgreSQL created here (not the production Neon
# project), every outbound integration is switched off, email goes to the log,
# payments and locks are mocks, and the AI provider is the local echo stub.
#
#   habitat-test-api      the HTTP API and the interface
#   habitat-test-worker   queue workers (invitation emails to the log, reports)
#   habitat-test-redis    cache, queues and locks
#   habitat-test-db       PostgreSQL, synthetic demo data only
#
# No scheduler: nothing time-based needs to run for testing, and channel sync
# is disabled anyway. No bot bridge: the AI provider is the echo stub.
#
# APP_KEY is entered once when the blueprint is created and shared by the two
# services. Use a fresh key made for this environment; never the production one.

databases:
  - name: habitat-test-db
    plan: free # expires after 30 days; fine for a test, recreate if needed
    postgresMajorVersion: "16"
    ipAllowList: [] # only Render services reach it

services:
  - type: redis
    name: habitat-test-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: habitat-test-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Habitat PMS (test)
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # entered once at creation; see the note above
      - key: APP_URL
        fromService:
          type: web
          name: habitat-test-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_FRONTEND_URL
        fromService:
          type: web
          name: habitat-test-api
          envVarKey: RENDER_EXTERNAL_URL

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: habitat-test-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: habitat-test-redis
          property: connectionString
      - key: CACHE_STORE
        value: redis
      - key: CACHE_PREFIX
        value: habitat_test
      - key: QUEUE_CONNECTION
        value: redis
      - key: SESSION_DRIVER
        value: redis

      - key: FILESYSTEM_DISK
        value: local

      # Nothing real leaves this environment.
      - key: MAIL_MAILER
        value: log # invitation links appear in the service logs
      - key: PAYMENTS_DEFAULT_PROVIDER
        value: mock
      - key: LOCKS_DEFAULT_PROVIDER
        value: mock
      - key: AI_DEFAULT_PROVIDER
        value: echo
      - key: OUTBOUND_INTEGRATIONS_ENABLED
        value: "false" # Hostex writes, webhook deliveries and AI bots refused
      - key: CHANNELS_SYNC_ENABLED
        value: "false" # no scheduled pulls

      - key: REGISTRATION_OPEN
        value: "true" # public sign-up creates client accounts only

      # Boot: migrate, sync permissions, provision client accounts, seed the
      # synthetic demo portfolio (every demo login has the password `password`).
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"

  - type: worker
    name: habitat-test-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: worker
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Habitat PMS (test)
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        fromService:
          type: web
          name: habitat-test-api
          envVarKey: APP_KEY
      - key: APP_URL
        fromService:
          type: web
          name: habitat-test-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: habitat-test-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: habitat-test-redis
          property: connectionString
      - key: CACHE_STORE
        value: redis
      - key: CACHE_PREFIX
        value: habitat_test
      - key: QUEUE_CONNECTION
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
      - key: PAYMENTS_DEFAULT_PROVIDER
        value: mock
      - key: LOCKS_DEFAULT_PROVIDER
        value: mock
      - key: AI_DEFAULT_PROVIDER
        value: echo
      - key: OUTBOUND_INTEGRATIONS_ENABLED
        value: "false"
      - key: CHANNELS_SYNC_ENABLED
        value: "false"
      - key: RUN_MIGRATIONS
        value: "false"
