# Render Blueprint for Habitat PMS.
#
# Creates everything the platform needs in one go:
#
#   habitat-api        the HTTP API and the admin application
#   habitat-worker     queue workers (channel sync, messaging, reports, webhooks)
#   habitat-scheduler  the cron entry that drives time-based work
#   habitat-redis      cache, queues and locks
#
# The database is Neon, not a Render database, so it is not created here: you
# paste its connection string into DB_URL when you sync the blueprint.
#
# The worker and the scheduler run the *same image* as the web service and
# differ only in their start command, so what is tested is what runs in every
# role.
#
# APP_KEY is deliberately not generated here. It encrypts door codes, Wi-Fi
# passwords and owner bank details, so it must be stable for the life of the
# data — a regenerated key makes every encrypted column unreadable. Render
# will prompt for it when you sync the blueprint; produce one locally with:
#
#     php artisan key:generate --show

services:
  # -------------------------------------------------------------------------
  # Cache, queues and locks
  # -------------------------------------------------------------------------
  - type: redis
    name: habitat-redis
    plan: starter
    # Only Render services reach it; nothing is exposed publicly.
    ipAllowList: []
    maxmemoryPolicy: noeviction # queues must never have jobs evicted

  # -------------------------------------------------------------------------
  # API and admin application
  # -------------------------------------------------------------------------
  - type: web
    name: habitat-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Habitat PMS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # entered once, then kept; see the note above
      - key: APP_URL
        fromService:
          type: web
          name: habitat-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_FRONTEND_URL
        fromService:
          type: web
          name: habitat-api
          envVarKey: RENDER_EXTERNAL_URL

      - key: LOG_CHANNEL
        value: stderr # Render collects stdout/stderr; files would be lost
      - key: LOG_LEVEL
        value: info

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false # the Neon connection string; see docs/deployment.md

      - key: REDIS_URL
        fromService:
          type: redis
          name: habitat-redis
          property: connectionString
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: SESSION_DRIVER
        value: redis

      - key: FILESYSTEM_DISK
        value: local # switch to s3 and add credentials for durable uploads
      - key: MAIL_MAILER
        value: log # replace with a real transport before inviting users

      # Bundled simulated providers. Each is reported in the interface as
      # simulated, never as a live connection.
      - key: PAYMENTS_DEFAULT_PROVIDER
        value: mock
      - key: LOCKS_DEFAULT_PROVIDER
        value: mock
      # `echo` composes drafts locally and the interface labels every one of them
      # as simulated. Set this to `claude` and supply ANTHROPIC_API_KEY below for
      # a real model; with `claude` selected and no key, the provider refuses and
      # says why rather than producing something that looks model-written.
      - key: AI_DEFAULT_PROVIDER
        value: echo
      # Supplied in the Render dashboard, not in this file. Leaving it unset is a
      # supported state: the guest agent still drafts, still applies every gate,
      # and reports itself as a simulation.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5

      # Run migrations on boot. Safe for a single web instance; set to false
      # and run them as a one-off job once you scale past one.
      - key: RUN_MIGRATIONS
        value: "true"
      # Loads the demo portfolio on boot: four Lisbon properties, three owners,
      # fifteen bookings, and one account per role — all with the password
      # `password`, on a public URL.
      #
      # Turned on so there is something to sign in to. Set it back to "false"
      # once a real organization exists. The seeder is idempotent and declines
      # if the demo organization is already there, so leaving it on does not
      # duplicate anything, but it does keep known credentials live.
      - key: SEED_DEMO_DATA
        value: "true"

  # -------------------------------------------------------------------------
  # Queue workers
  # -------------------------------------------------------------------------
  - type: worker
    name: habitat-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: worker
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Habitat PMS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: habitat-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false # the Neon connection string; see docs/deployment.md
      - key: REDIS_URL
        fromService:
          type: redis
          name: habitat-redis
          property: connectionString
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: MAIL_MAILER
        value: log
      - key: PAYMENTS_DEFAULT_PROVIDER
        value: mock
      - key: LOCKS_DEFAULT_PROVIDER
        value: mock
      - key: AI_DEFAULT_PROVIDER
        value: echo
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      # Only the web service migrates, so a deploy cannot run migrations twice.
      - key: RUN_MIGRATIONS
        value: "false"

  # -------------------------------------------------------------------------
  # Scheduler
  # -------------------------------------------------------------------------
  # Laravel's scheduler expects to be invoked every minute; it then decides
  # what is actually due. Time-based automation is evaluated against each
  # property's own timezone inside the job, not against this cron's clock.
  - type: cron
    name: habitat-scheduler
    runtime: docker
    plan: starter
    schedule: "* * * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: scheduler
    envVars:
      - key: APP_NAME
        value: Habitat PMS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: habitat-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false # the Neon connection string; see docs/deployment.md
      - key: REDIS_URL
        fromService:
          type: redis
          name: habitat-redis
          property: connectionString
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: MAIL_MAILER
        value: log
      - key: RUN_MIGRATIONS
        value: "false"
